[project]
name = "poker"
version = "0.1.0"
description = "Apple-Silicon-first poker reinforcement learning: Rust simulator, MLX training."
readme = "README.md"
authors = [
    { name = "Rami", email = "ramilejmi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.maturin]
manifest-path = "crates/poker-py/Cargo.toml"
module-name = "poker._native"
python-source = "python"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "maturin>=1.15.0",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "textual>=8.2.8",
    "ty>=0.0.84",
    "wily>=1.25.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "ANN", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = "--doctest-modules"
